name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # main
      - name: Audit
        run: brew audit --strict --online jinzhongjia/tap/zig-analyzer
      - name: Install
        run: brew install jinzhongjia/tap/zig-analyzer
      - name: Test
        run: brew test jinzhongjia/tap/zig-analyzer
